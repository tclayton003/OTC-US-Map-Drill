 if(mode==="launch"){if(checked)return;sel.has(k)?sel.delete(k):sel.add(k);paths[k].classList.toggle("sel",sel.has(k))}

 $("res").innerHTML=`<p class="msg ${perfect?"good":"bad"}">${perfect?"Perfect! ":""}${hit} of 6 found${extra?`, ${extra} wrong pick${extra>1?"s":""} (red)`:""}.${hit<6?" Missed ones are outlined in red.":""}</p><ul class="sites">${Object.keys(LAUNCH).map(k=>`<li><b>${NAME[k]}</b> — ${LAUNCH[k]}</li>`).join("")}</ul><div class="row"><button class="btn primary" id="nx">Try again</button></div>`;$("nx").onclick=next}
